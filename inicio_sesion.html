<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica,serif;
        }
    </style>
    <meta charset="UTF-8">
    <title>Casino Nova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="zona_superior">
    <div class="contenedor-marca">
        <a href="index.html">
            <img
                    src="images/marca_casino.jpeg"
                    alt="logo"
                    height="100px"
                    width="200px"
            >
        </a>

    </div>

    <div>
        <label for="barra">Ingrese para buscar:</label>
        <input
                type="search"
                class="barra"
                placeholder="Buscar..."
                id="barra"
        >

        <nav class="contenedor_superior">
            <button> Ranking </button>
            <button> Amigos </button>
            <button> Historial </button>
            <button> Billetera </button>
            <button> Préstamos </button>

        </nav>
    </div>

    <div class="contenedor-perfil">
        <div class="bloque-saldo">
            <span class="saldo" >$1.000.000 - <span style="color: slateblue"> CLP($)</span></span>
        </div>


        <button class="boton-deposito">Deposito</button>
        <a href="inicio_sesion.html">
            <img
                    src="images/foto_perfil.png"
                    alt="foto_perfil"
                    height="50px"
                    width="50px"
            >
        </a>
    </div>
</header>

<main>
    <div class="contenedor-sesion">
        <div class="formulario_inicio_sesion">
            <h1 class="texto-rosado">Inicia sesión</h1>
            <h3 class = "texto-rosado"> Debes tener una cuenta para poder participar</h3>
            <input type="text" placeholder="Usuario">
            <input type="password" placeholder="Contraseña">
            <button class ="mi-botton">Iniciar sesion</button>
            <button class ="mi-botton">Crear cuenta</button>
        </div>
        <div class="imagen_inicio_sesion">
            <img src="images/Blackjack.jpg" alt="blackjack">
            <img src="images/ruleta.jpg" alt="ruleta">
        </div>
    </div>
</main>
<footer class="pie-pagina">
    <p>© 2026 Casino Nova - Todos los derechos reservados</p>
</footer>

</body>
</html>
